[project]
name = "dispute-resolve-agent"
version = "0.1.0"
description = "Agentic GRPO dispute resolution agent with SFT and OpenAI Agents SDK runtime"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.11,<3",
  "numpy>=2.0,<3",
  "pyyaml>=6.0,<7",
  "datasets>=4.0,<5",
  "pyarrow>=20,<22",
  "scikit-learn>=1.7,<2",
  "matplotlib>=3.10,<4",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "httpx>=0.28,<1"]
train = [
  "torch==2.8.0",
  "torchvision==0.23.0",
  "transformers>=4.55,<5",
  "trl>=0.20,<1",
  "peft>=0.17,<1",
  "accelerate>=1.10,<2",
  "vllm==0.10.2",
  "verl==0.5.0",
  "openai-agents==0.6.0",
  "agentlightning==0.3.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dispute_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
