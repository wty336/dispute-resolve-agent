model: Qwen/Qwen3-8B
data_dir: data/generated
bf16: true
load_in_4bit: false
load_in_8bit: false
lora:
  rank: 32
  alpha: 64
  dropout: 0.0
  target_modules: all-linear
assistant_only_loss: true
packing: false
seed: 20260817
data_seed: 20260817
max_length: 2048
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
global_batch_size: 16
num_train_epochs: 3
learning_rate: 0.0002
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
max_grad_norm: 1.0
gradient_checkpointing: true
attention_implementation: sdpa
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 2
logging_steps: 5
output_root: checkpoints/sft
